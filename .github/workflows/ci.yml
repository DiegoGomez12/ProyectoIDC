name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Solo lectura del repo: el pipeline no necesita escribir nada
permissions:
  contents: read

# Si subes otro commit al mismo PR, cancela la corrida anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend - pruebas
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Correr pruebas
        run: npm test
  docker:
    name: Docker - Build y Push
    # No compila ni sube imágenes si las pruebas fallan
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Solo se autentica si es push a main
      - name: Iniciar sesión en Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # En PR solo valida el build; en main sube con latest y el SHA
      - name: Construir y subir Backend (timecheck-api)
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/timecheck-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/timecheck-api:${{ github.sha }}

      - name: Construir y subir Frontend (timecheck-web)
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/timecheck-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/timecheck-web:${{ github.sha }}

  deploy:
    name: Deploy - Azure App Service
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Disparar Webhook de Backend (timecheck-api)
        env:
          WEBHOOK_URL: ${{ secrets.AZURE_API_WEBHOOK_URL }}
        run: curl --fail -sS -X POST "$WEBHOOK_URL"

      - name: Disparar Webhook de Frontend (timecheck-web)
        env:
          WEBHOOK_URL: ${{ secrets.AZURE_WEB_WEBHOOK_URL }}
        run: curl --fail -sS -X POST "$WEBHOOK_URL"
